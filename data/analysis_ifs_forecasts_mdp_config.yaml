schema_version: v0.5.0
dataset_version: v0.1.0

output:
  variables:
    mask: [grid_index, mask_feature]
    static: [grid_index, static_feature]
    forcing: [init_time, lead_time, grid_index, forcing_feature]
  coord_ranges:
    init_time:
      start: 2024-01-02T00:00
      end: 2024-12-24T00:00
      step: PT168H
  chunking:
    init_time: 1
    lead_time: 1
  splitting:
    dim: init_time
    splits:
      test:
        start: 2024-01-02T00:00
        end: 2024-12-24T00:00

inputs:
  atmosphere_single_level:
    path: njord_global_analysis/ifs_analysis_forecasts.zarr
    dims: [init_time, lead_time, longitude, latitude]
    variables:
      - sotemair
      - sowinu10
      - sowinv10
      - sosudosw
      - sosudolw
      - sowaprec
      - sod2m
      - somslpre
    dim_mapping:
      init_time:
        method: rename
        dim: init_time
      lead_time:
        method: rename
        dim: lead_time
      grid_index:
        method: stack
        dims: [longitude, latitude]
      forcing_feature:
        method: stack_variables_by_var_name
        name_format: "{var_name}"
    target_output_variable: forcing
