schema_version: v0.5.0
dataset_version: v0.1.0

output:
  variables:
    mask: [grid_index, mask_feature]
    static: [grid_index, static_feature]
    forcing: [time, grid_index, forcing_feature]
  coord_ranges:
    time:
      start: 1993-01-01T00:00
      end: 2024-12-31T00:00
      step: PT24H
  chunking:
    time: 1
  splitting:
    dim: time
    splits:
      train:
        start: 1993-01-01T00:00
        end: 2021-12-31T00:00
        compute_statistics:
          ops: [mean, std, diff_mean, diff_std]
          dims: [grid_index, time]
      val:
        start: 2022-01-01T00:00
        end: 2022-12-31T00:00
      test:
        start: 2024-01-01T00:00
        end: 2024-12-31T00:00

inputs:
  atmosphere_single_level:
    path: /scratch/project_462001063/dholmber/ocean-data/data/baltic_era5.zarr
    dims: [time, longitude, latitude]
    variables:
      - sotemair
      - sowinu10
      - sowinv10
      - sosudosw
      - sosudolw
      - sowaprec
      - sod2m
      - somslpre
    dim_mapping:
      time:
        method: rename
        dim: time
      grid_index:
        method: stack
        dims: [longitude, latitude]
      forcing_feature:
        method: stack_variables_by_var_name
        name_format: "{var_name}"
    target_output_variable: forcing

extra:
  projection:
    class_name: LambertConformal
    kwargs:
      central_longitude: 20.0
      central_latitude: 60.0
      standard_parallels: [60.0, 60.0]
      globe:
        semimajor_axis: 6371229.0
        semiminor_axis: 6371229.0